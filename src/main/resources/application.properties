spring.application.name=store

spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=jdbc:postgresql://localhost:5433/ngo-donation-portal
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
server.port=8090

# The React frontend sends and expects snake_case JSON (donor_name, target_amount, ...)
spring.jackson.property-naming-strategy=SNAKE_CASE

jwt.secret=${JWT_SECRET:change_this_secret_change_this_secret_change_this}
jwt.expiration-ms=86400000

ngo.name=MICF NGO