# The build must not need a live Postgres, so the context test runs against an
# in-memory database and a throwaway signing key. Real schema work is unaffected:
# ddl-auto stays off in the main profile.
spring.datasource.url=jdbc:h2:mem:storetest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=test-secret-test-secret-test-secret-test-secret
